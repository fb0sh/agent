[package]
name = "agent"
version = "0.1.0"
edition = "2024"
description = "A minimal, general-purpose coding agent: read, write, edit, exec."

[features]
default = []
# The CLI is a thin shell over the library; neither clap nor dotenvy is needed to
# build the library.
cli = ["dep:clap", "dep:dotenvy"]

[[bin]]
name = "mini-agent"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
